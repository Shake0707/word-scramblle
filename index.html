<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>word-scrablle</title>
</head>

<body>
  <div class="box">
    <h1 class="title">Word Scramblle</h1>
    <div class="random-box" >
      <h1 id="random_letters"></h1>
      <div class="letters-loader" id="loader-letters"></div>
    </div>
    <div class="tries-mistakes">
      <div class="left">
        <div>
          Tries (<span id="tries_num">0</span>/5):
        </div>
        <div id="tries_vizual" class="tries_vizual">
          <div class="active"></div>
          <div class="active"></div>
          <div class="active"></div>
          <div></div>
          <div></div>
        </div>
      </div>
      <div class="right">
        Mistakes: <div id="mistakes">a, e, w, t</div>
      </div>
    </div>
    <div class="input_frame">
      <!-- <input type="text" maxlength="1" placeholder="_">
      <input type="text" maxlength="1" placeholder="_">
      <input type="text" maxlength="1" placeholder="_">
      <input type="text" maxlength="1" placeholder="_">
      <input type="text" maxlength="1" placeholder="_">
      <input type="text" maxlength="1" placeholder="_"> -->
    </div>
    <div class="action">
      <button class="btn" id="random">Random</button>
      <button class="btn" id="reset">Reset</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
